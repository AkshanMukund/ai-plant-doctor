<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Plant Doctor</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eaf7ed;
  text-align: center;
  padding: 20px;
  margin: 0;
}
.container {
  max-width: 430px;
  margin: 20px auto;
  background: white;
  padding: 24px;
  border-radius: 20px;
  box-shadow: 0 4px 15px #0002;
}
h1 { color: #16813b; }
p { color: #555; }
button, .upload {
  display: inline-block;
  background: #16813b;
  color: white;
  border: none;
  padding: 14px 20px;
  border-radius: 10px;
  margin: 8px;
  font-size: 16px;
  cursor: pointer;
}
button:disabled { opacity: .5; }
#preview {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 12px;
  display: none;
}
#result {
  font-size: 20px;
  font-weight: bold;
  margin: 18px 0;
  color: #16813b;
}
.prediction {
  background: #f0f7f1;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  text-align: left;
}
#status { color: #555; }
</style>
</head>

<body>
<div class="container">

<h1>🌱 AI Plant Doctor</h1>
<p>Smart AI-powered Plant Health Detection</p>

<p id="status">Loading your AI model...</p>

<label class="upload">
📷 Capture / Upload Leaf
<input id="imageInput" type="file"
accept="image/*" capture="environment"
hidden>
</label>

<img id="preview" alt="Selected leaf">

<button id="analyse" disabled onclick="analyseLeaf()">
🔍 Analyse Leaf
</button>

<div id="result"></div>
<div id="predictions"></div>

<button onclick="resetApp()">Reset</button>

<p style="font-size:12px">
AI Plant Doctor – Healthy Leaf / Damaged Leaf
</p>

</div>

<script>
const URL =
"https://teachablemachine.withgoogle.com/models/E7e-i7a6X/";

let model;
let selectedImage = null;

async function loadModel() {
  try {
    model = await tmImage.load(
      URL + "model.json",
      URL + "metadata.json"
    );

    document.getElementById("status").textContent =
      "✅ AI Model Ready! Upload a leaf image.";

  } catch (error) {
    document.getElementById("status").textContent =
      "Model loading failed. Check your internet connection.";
    console.error(error);
  }
}

document.getElementById("imageInput")
.addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please select an image.");
    return;
  }

  const imageURL = URL.createObjectURL(file);
  const preview = document.getElementById("preview");

  preview.onload = function() {
    selectedImage = preview;
    document.getElementById("analyse").disabled = !model;
    document.getElementById("result").textContent = "";
    document.getElementById("predictions").innerHTML = "";
  };

  preview.src = imageURL;
  preview.style.display = "block";
});

async function analyseLeaf() {
  if (!model || !selectedImage) return;

  const button = document.getElementById("analyse");
  button.disabled = true;

  document.getElementById("result").textContent =
    "🔄 Analysing your leaf...";

  try {
    const predictions = await model.predict(selectedImage);

    predictions.sort((a, b) =>
      b.probability - a.probability
    );

    const best = predictions[0];

    document.getElementById("result").textContent =
      "🌿 " + best.className +
      " (" + (best.probability * 100).toFixed(1) + "%)";

    document.getElementById("predictions").innerHTML = "";

    predictions.forEach(item => {
      const div = document.createElement("div");
      div.className = "prediction";

      const label = document.createElement("strong");
      label.textContent = item.className;

      const score = document.createElement("div");
      score.textContent =
        (item.probability * 100).toFixed(1) + "% confidence";

      div.appendChild(label);
      div.appendChild(score);

      document.getElementById("predictions")
        .appendChild(div);
    });

  } catch (error) {
    document.getElementById("result").textContent =
      "Analysis failed. Please try again.";
    console.error(error);
  }

  button.disabled = false;
}

function resetApp() {
  selectedImage = null;
  document.getElementById("imageInput").value = "";
  document.getElementById("preview").style.display = "none";
  document.getElementById("result").textContent = "";
  document.getElementById("predictions").innerHTML = "";
  document.getElementById("analyse").disabled = true;
}

loadModel();
</script>
</body>
</html>
